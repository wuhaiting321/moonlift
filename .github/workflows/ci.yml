name: CI

# Runs the same gate a reviewer runs locally: `bash script/check.sh`.
# If this is green, the package builds on three targets, the 162 white-box
# tests pass, the decoder agrees with wabt, every fixture decompiles into a
# package that `moon check` accepts at zero warnings, and the generated code
# matches the original modules under Node.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate (3 targets, 162 tests, 481 differential calls)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          # The corpus and the pinned counts were produced with 0.1.20261020.
          # That exact build is no longer served by the CDN (403), so CI tracks
          # the current release; the gate pins project-level counts only, and a
          # newer compiler shows up as a diff rather than a silent pass.
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wabt (independent decoder cross-check)
        run: npm --prefix corpus/tools ci

      - name: Toolchain versions
        run: |
          moon version --all
          node --version

      # A fresh runner has no package-registry index, so `moon check` cannot
      # resolve `moonbitlang/x` and every later step fails with "module was not
      # found in the registry". One `moon update` fetches the index; the first
      # `moon check` then downloads the pinned dependency into .mooncakes.
      - name: Update package registry
        run: moon update

      - name: Full gate
        run: bash script/check.sh
